<!DOCTYPE html>
<html lang = "en">
<head>
    <title>Temperature Converter</title>
    <link rel = "stylesheet" href = "style.css">
</head>

<body>
  <div>
    <h1 id = "head">Temperature Converter</h1>
    </div>
    <div class = "converter">
      <div class = "buttons">
        <button id = "Celsius">C°</button>
        <button id = "Fahrenheit">F°</button>
        <button id = "Kelvin">K</button>
        </div>
        <div>
            <div id = "flask">
                <div id = "mercury"></div>
                <div id = "round"></div>
            </div>
        <input id = "input" type ="number" placeholder="Enter Temperature">
              </div>
              <div id = "output1">
                C°
                <input class ="output" readonly>
              </div>
              <div id = "output2">
                F°
                <input class ="output" readonly>
              </div>
                <div id = "output3">
                <span id = "label">K</span>
                <input class ="output" readonly>
              </div>
    </div>
<script src = "script.js"></script>
</body>
</html>
